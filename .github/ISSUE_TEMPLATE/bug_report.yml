name: Reporte de bug
description: Algo no funciona como debería en el sitio o en el build.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Cuanto más concreto, más rápido se reproduce.
        No incluyas datos de clientes ni credenciales.

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir https://hyamfood.com
        2. Ir a la sección ...
        3. Ver el error
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: real
    attributes:
      label: Comportamiento real
    validations:
      required: true

  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Producción (hyamfood.com)
        - Local (npm run dev)
        - Build (npm run build)
    validations:
      required: true

  - type: input
    id: navegador
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome 130 en Windows 11 / Safari en iPhone 13
