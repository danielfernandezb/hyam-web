name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint y build · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias (lockfile estricto)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build de producción
        run: npm run build

      - name: Presupuesto de rendimiento
        run: |
          JS=$(stat -c%s dist/assets/*.js)
          CSS=$(stat -c%s dist/assets/*.css)
          echo "JS:  $((JS / 1024)) KB"
          echo "CSS: $((CSS / 1024)) KB"
          if [ "$JS" -gt 800000 ]; then
            echo "::error::El bundle JS supera 800 KB ($((JS / 1024)) KB)"
            exit 1
          fi

      - name: Publicar artefacto del build
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (alto y crítico)
        run: npm audit --audit-level=high
        continue-on-error: true
