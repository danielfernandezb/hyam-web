name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests y build · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias (lockfile estricto)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test

      - name: Cobertura con umbrales
        if: matrix.node == 20
        run: npm run test:coverage

      - name: Build de producción
        run: npm run build

      - name: Presupuesto de rendimiento
        run: |
          JS=$(stat -c%s dist/assets/*.js)
          CSS=$(stat -c%s dist/assets/*.css)
          echo "JS:  $((JS / 1024)) KB"
          echo "CSS: $((CSS / 1024)) KB"
          if [ "$JS" -gt 800000 ]; then
            echo "::error::El bundle JS supera 800 KB ($((JS / 1024)) KB)"
            exit 1
          fi

      - name: Publicar artefacto del build
        if: matrix.node == 20
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

      - name: Publicar reporte de cobertura
        if: matrix.node == 20
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: Pruebas de interfaz (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias (lockfile estricto)
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas e2e (build incluido)
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (alto y crítico)
        run: npm audit --audit-level=high
        continue-on-error: true
