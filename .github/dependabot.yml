version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
    # Las actualizaciones major se migran a mano: rompen API y necesitan QA visual.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tooling:
        patterns:
          - "eslint*"
          - "vite*"
          - "vitest*"
          - "tailwind*"
          - "postcss*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
